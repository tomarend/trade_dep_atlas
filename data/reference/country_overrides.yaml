# Manual overrides for territories and entities not in pycountry or with non-standard mappings.
# Format: baci_code → override fields. These take precedence over pycountry lookups.
overrides:
  # Non-standard territories
  158:  # Taiwan
    iso3: "TWN"
    name: "Taiwan"
    region: "Eastern Asia"
    continent: "Asia"
  983:  # Kosovo (BACI uses various codes)
    iso3: "XKX"
    name: "Kosovo"
    region: "Southern Europe"
    continent: "Europe"
  275:  # Palestine
    iso3: "PSE"
    name: "Palestine"
    region: "Western Asia"
    continent: "Asia"
  532:  # Netherlands Antilles (dissolved 2010)
    iso3: "ANT"
    name: "Netherlands Antilles"
    region: "Caribbean"
    continent: "Americas"
  736:  # Sudan (before South Sudan split)
    iso3: "SDN"
    name: "Sudan"
    region: "Northern Africa"
    continent: "Africa"

# Historical entities → successor states (for splitting trade flows in older years)
historical:
  200:  # Czechoslovakia (dissolved 1993)
    successors: ["CZE", "SVK"]
    dissolved_year: 1993
  891:  # Yugoslavia/Serbia-Montenegro
    successors: ["SRB", "MNE"]
    dissolved_year: 2006
  810:  # USSR
    successors: ["RUS", "UKR", "BLR", "KAZ", "UZB", "GEO", "AZE", "LTU", "LVA", "EST", "TJK", "KGZ", "TKM", "MDA", "ARM"]
    dissolved_year: 1991
  890:  # Yugoslavia (original)
    successors: ["SVN", "HRV", "BIH", "SRB", "MNE", "MKD", "XKX"]
    dissolved_year: 1992

# Re-export hub flags
reexport_hubs: ["NLD", "SGP", "HKG", "ARE", "BEL"]

